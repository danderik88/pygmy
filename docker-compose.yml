# Pygmy on any Linux x86_64 box with Docker. Settings live in .env (copy .env.example).
# app and go2rtc use the host network: printer discovery listens for UDP broadcasts on port 2021.
services:
  app:
    build: .
    network_mode: host
    env_file: .env
    environment:
      # Spaghetti detection: Obico (its own container) fetches each frame from this listener, which serves frames
      # and streams only. Without it the detector never starts.
      BFF_LAN_BIND: "0.0.0.0"
      BFF_OBICO_FRAME_BASE: "http://host.docker.internal:8766"
    volumes:
      - pygmy-data:/var/lib/pygmy
    restart: unless-stopped

  slicer:
    build:
      context: .
      dockerfile: deploy/slicer/Dockerfile
    environment:
      SLICER_SECRET: ${PYGMY_SLICER_SECRET:?set PYGMY_SLICER_SECRET in .env}
    volumes:
      - orca-data:/home/slicer/orca-gui  # the Orca Cloud sign-in and the presets it syncs
    ports:
      - "127.0.0.1:8770:8765"  # only Pygmy on this machine can reach it
    restart: unless-stopped

  ml_api:  # spaghetti detection: Obico's ML API, built unmodified from their repository (AGPL-3.0, its own container)
    build:  # Obico's CPU image (~600 MB, ONNX model); their default one carries CUDA (~9 GB) for GPUs
      context: https://github.com/TheSpaghettiDetective/obico-server.git#df8190ef7500459599ebf398c3d1f653754792fd:ml_api
      dockerfile: Containerfile.cpu
    ports:
      - "127.0.0.1:3333:3333"  # only Pygmy asks it; it fetches each frame from Pygmy's LAN listener
    extra_hosts:
      - "host.docker.internal:host-gateway"  # the host, where the app listens on the host network
    restart: unless-stopped

  go2rtc:  # live camera, WebRTC and RTSP for Home Assistant
    image: alexxit/go2rtc:1.9.9
    network_mode: host
    env_file: .env
    volumes:
      - ./deploy/go2rtc.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped

volumes:
  pygmy-data:
  orca-data:
